[workspace]
resolver = "3"
members = [
    "crates/environment-core",
    "crates/environment-policy",
    "crates/environment-egress-gateway",
    "crates/environment-guest",
    "crates/environment-lambda",
    "crates/environment-wire",
    "crates/aws-microvm-controller",
    "crates/environment-driver",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aexhq/extensions"

[workspace.dependencies]
# Brain owns the protocol and Environment ports. Both packages resolve from one immutable source
# identity so Environments can build without a sibling checkout and cannot drift across contracts.
brain = { git = "https://github.com/aexhq/brain.git", rev = "6ea80b25777d18ae676e47eabc994fe6d86d8aaf" }
brain-protocol = { git = "https://github.com/aexhq/brain.git", rev = "6ea80b25777d18ae676e47eabc994fe6d86d8aaf" }
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-lambdamicrovms = { version = "1.3", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
cap-std = "4.0.3"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
idna = "1"
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
