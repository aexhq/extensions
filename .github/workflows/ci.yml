name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: extensions-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNTIME: packages/env-aws-microvm/runtime

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aexhq/brain
          path: brain-source
          ref: e39dc6621fa2c2a5747505e1125033f9e849f849
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install the exact Brain source under test
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix brain-source
          brain_archive=$(npm pack --silent --workspace @aexhq/brain --pack-destination "$RUNNER_TEMP" --prefix brain-source)
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false "$RUNNER_TEMP/$brain_archive"
          echo "BRAIN_PACKAGE_ARCHIVE=$RUNNER_TEMP/$brain_archive" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run package-smoke
      - run: npm audit --audit-level=high

  runtime-format-clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/env-aws-microvm/runtime -> target
      - run: cargo fmt --manifest-path "$RUNTIME/Cargo.toml" --all -- --check
      - run: cargo clippy --manifest-path "$RUNTIME/Cargo.toml" --workspace --all-targets -- -D warnings

  runtime-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/env-aws-microvm/runtime -> target
      - run: cargo test --manifest-path "$RUNTIME/Cargo.toml" --workspace --all-targets --locked

  linux-environment-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/env-aws-microvm/runtime -> target
      - run: cargo build --manifest-path "$RUNTIME/Cargo.toml" -p environment-guest --release --locked
      - name: Build and inspect the native image
        working-directory: packages/env-aws-microvm/runtime
        run: |
          set -euo pipefail
          docker build -f image/Dockerfile --build-arg BIN=target/release/environment-guest -t environment:ci .
          docker run --rm --entrypoint sh --user 0:0 environment:ci -ceu '
            test -z "$(find / -xdev -type f -perm /6000 -print -quit)"
            test -z "$(getcap -r / 2>/dev/null || true)"
            test "$(stat -c "%u:%g:%a" /var/environment)" = "1001:1000:710"
          '

  build-test:
    if: always()
    needs: [packages, runtime-format-clippy, runtime-test, linux-environment-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Every release gate passed
        env:
          PACKAGES: ${{ needs.packages.result }}
          LINT: ${{ needs.runtime-format-clippy.result }}
          TEST: ${{ needs.runtime-test.result }}
          IMAGE: ${{ needs.linux-environment-image.result }}
        run: |
          test "$PACKAGES" = success
          test "$LINT" = success
          test "$TEST" = success
          test "$IMAGE" = success
