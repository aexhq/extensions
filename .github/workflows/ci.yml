name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: extensions-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNTIME: packages/env-aws-microvm/runtime

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.packages == 'true' }}
      audit: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.dependencies == 'true' }}
      runtime-format-clippy: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.runtime == 'true' }}
      runtime-test: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.runtime == 'true' }}
      linux-environment-image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.runtime == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      # Compare the tested merge commit with its base, including every PR commit and both rename paths.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          token: ''
          predicate-quantifier: every
          filters: |
            common:
              - '!*.md'
              - '!**/README*.md'
              - '!{packages/loop-codex,packages/loop-pi,packages/tools,packages/env-aws-microvm,shared}/**'
              - '!{package.json,package-lock.json}'
            packages:
              - '{packages/**,shared/**,package.json,package-lock.json}'
              - '!**/README*.md'
            dependencies:
              - '**/package{,-lock}.json'
            runtime:
              - 'packages/env-aws-microvm/runtime/**'
              - '!**/README*.md'

  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aexhq/brain
          path: brain-source
          ref: 8fcfa8d9b0c9b58e09664fa6b739d80de952e708
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install the exact Brain source under test
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix brain-source
          brain_archive=$(npm pack --silent --workspace @aexhq/brain --pack-destination "$RUNNER_TEMP" --prefix brain-source)
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false "$RUNNER_TEMP/$brain_archive"
          echo "BRAIN_PACKAGE_ARCHIVE=$RUNNER_TEMP/$brain_archive" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run package-smoke
      - name: Execute the built Agentloops through the pinned Brain image
        shell: bash
        run: |
          set -euo pipefail
          brain_ref=$(git -C brain-source rev-parse HEAD)
          docker run -d --name extension-brain --network host \
            -e BRAIN_API_TOKEN=extension-fixture-token \
            -e BRAIN_LISTEN=127.0.0.1:18092 \
            -e BRAIN_MODEL_BASE_URL=http://127.0.0.1:18093/v1 \
            "ghcr.io/aexhq/brain:sha-$brain_ref"
          trap 'docker rm -f extension-brain >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18092/health/ready >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          if ! timeout 300 node tools/check-native-loops.mjs; then
            docker logs extension-brain
            exit 1
          fi

  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      # Reads package-lock.json; no install, so a slow registry costs this job alone.
      - run: npm audit --audit-level=high

  runtime-format-clippy:
    needs: changes
    if: needs.changes.outputs.runtime-format-clippy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/env-aws-microvm/runtime -> target
      - run: cargo fmt --manifest-path "$RUNTIME/Cargo.toml" --all -- --check
      - run: cargo clippy --manifest-path "$RUNTIME/Cargo.toml" --workspace --all-targets -- -D warnings

  runtime-test:
    needs: changes
    if: needs.changes.outputs.runtime-test == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/env-aws-microvm/runtime -> target
      - run: cargo test --manifest-path "$RUNTIME/Cargo.toml" --workspace --all-targets --locked

  linux-environment-image:
    needs: changes
    if: needs.changes.outputs.linux-environment-image == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/env-aws-microvm/runtime -> target
      - run: cargo build --manifest-path "$RUNTIME/Cargo.toml" -p environment-guest --release --locked
      - name: Build and inspect the native image
        working-directory: packages/env-aws-microvm/runtime
        run: |
          set -euo pipefail
          docker build -f image/Dockerfile --build-arg BIN=target/release/environment-guest -t environment:ci .
          docker run --rm --entrypoint sh --user 0:0 environment:ci -ceu '
            test -z "$(find / -xdev -type f -perm /6000 -print -quit)"
            test -z "$(getcap -r / 2>/dev/null || true)"
            test "$(stat -c "%u:%g:%a" /var/environment)" = "1001:1000:710"
          '

  build-test:
    if: always()
    needs: [changes, packages, audit, runtime-format-clippy, runtime-test, linux-environment-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Every affected check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { changes, ...jobs } = JSON.parse(process.env.NEEDS);
          assert.equal(changes.result, 'success', 'change detection must succeed');
          for (const [name, job] of Object.entries(jobs)) {
            const selected = changes.outputs[name];
            assert.ok(['true', 'false'].includes(selected), `${name}: missing selection`);
            const expected = selected === 'true' ? 'success' : 'skipped';
            assert.equal(job.result, expected, `${name}: expected ${expected}, got ${job.result}`);
          }
          NODE
