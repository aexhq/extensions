name: publish npm packages

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bootstrap ownership, stage under next, hold next, or promote to latest
        type: choice
        required: true
        default: stage
        options: [bootstrap, stage, hold, promote]
      expected_commit:
        description: Exact 40-character extensions commit selected by the workflow ref
        type: string
        required: true
      stage_run_id:
        description: Successful stage or bootstrap run containing the immutable archives (hold or promote)
        type: string
        required: false
        default: ''

concurrency:
  group: extensions-npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the immutable source identity
        id: identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          OPERATION: ${{ inputs.operation }}
          SELECTED_COMMIT: ${{ github.sha }}
          SELECTED_REF: ${{ github.ref }}
          STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SELECTED_COMMIT" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$SELECTED_REF" = "refs/tags/release/sha-$EXPECTED_COMMIT"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          git merge-base --is-ancestor "$EXPECTED_COMMIT" origin/main
          release_sha="$EXPECTED_COMMIT"
          if [[ "$OPERATION" == promote || "$OPERATION" == hold ]]; then
            [[ "$STAGE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            stage_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID")
            test "$(jq -r .event <<<"$stage_run")" = workflow_dispatch
            test "$(jq -r .status <<<"$stage_run")" = completed
            test "$(jq -r .conclusion <<<"$stage_run")" = success
            [[ "$(jq -r .path <<<"$stage_run")" == .github/workflows/npm-publish.yml* ]]
            release_sha=$(jq -r .head_sha <<<"$stage_run")
            [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          else
            test -z "$STAGE_RUN_ID"
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  stage-tests:
    if: inputs.operation == 'bootstrap' || inputs.operation == 'stage'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test

  stage-package-smoke:
    if: inputs.operation == 'bootstrap' || inputs.operation == 'stage'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: npm run package-smoke

  component-host:
    if: inputs.operation == 'bootstrap' || inputs.operation == 'stage'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/component-host

  prepare:
    if: inputs.operation == 'bootstrap' || inputs.operation == 'stage'
    needs: [validate, stage-tests, stage-package-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.pack.outputs.versions }}
      workspaces: ${{ steps.pack.outputs.workspaces }}
      base: ${{ steps.pack.outputs.base }}
      dependents: ${{ steps.pack.outputs.dependents }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - name: Pack the exact release archives
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/extensions-npm-release"
          node tools/npm-release.mjs pack "$release_dir"
          versions=$(node tools/npm-release.mjs versions "$release_dir/manifest.json")
          order=$(node tools/npm-release.mjs order "$release_dir/manifest.json")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "workspaces=$(node tools/npm-release.mjs workspaces)" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -c .base <<<"$order")" >> "$GITHUB_OUTPUT"
          echo "dependents=$(jq -c .dependents <<<"$order")" >> "$GITHUB_OUTPUT"
          node tools/npm-release.mjs markdown "$release_dir/manifest.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: extensions-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/extensions-npm-release
          if-no-files-found: error
          retention-days: 30

  stage:
    if: inputs.operation == 'stage'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.prepare.outputs.base || '[]') }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: extensions-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/extensions-npm-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: node "$RUNNER_TEMP/extensions-npm-release/verify-dependencies.mjs" "$RUNNER_TEMP/extensions-npm-release/manifest.json"
      - name: Publish once with provenance under next
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: node "$RUNNER_TEMP/extensions-npm-release/publish.mjs" stage "${{ matrix.workspace }}"

  # Registry visibility of an exact version is a hard dependency of everything built or installed
  # against it, so these wait for the wave above and for nothing else.
  stage-dependents:
    if: inputs.operation == 'stage'
    needs: [prepare, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.prepare.outputs.dependents || '[]') }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: extensions-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/extensions-npm-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: node "$RUNNER_TEMP/extensions-npm-release/verify-dependencies.mjs" "$RUNNER_TEMP/extensions-npm-release/manifest.json"
      - name: Publish once with provenance under next
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: node "$RUNNER_TEMP/extensions-npm-release/publish.mjs" stage "${{ matrix.workspace }}"

  # The staged archive is the artifact a session loads, so its components run against the real host
  # ABI here, installed from the registry rather than rebuilt. Promotion consumes these receipts.
  component-smoke:
    if: ${{ !cancelled() && (needs.stage-dependents.result == 'success' || needs.bootstrap.result == 'success') }}
    needs: [prepare, component-host, stage-dependents, bootstrap]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.prepare.outputs.workspaces || '[]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: ./.github/actions/component-host
        id: host
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: extensions-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/extensions-npm-release
      - name: Install the exact staged version
        id: staged
        shell: bash
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          set -euo pipefail
          entry=$(jq -e --arg workspace "$WORKSPACE" '.packages[] | select(.workspace == $workspace)' \
            "$RUNNER_TEMP/extensions-npm-release/manifest.json")
          spec="$(jq -r .name <<<"$entry")@$(jq -r .version <<<"$entry")"
          consumer="$RUNNER_TEMP/staged-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "$spec"
          integrity=$(npm view "$spec" dist.integrity)
          test "$integrity" = "$(jq -r .integrity <<<"$entry")"
          echo "from=$consumer/node_modules/$(jq -r .name <<<"$entry")" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
      - name: Drive the staged components through a real round
        env:
          COMPONENT_HOST: ${{ steps.host.outputs.binary }}
          FROM: ${{ steps.staged.outputs.from }}
          SMOKE_INTEGRITY: ${{ steps.staged.outputs.integrity }}
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          node tools/component-smoke.mjs "$WORKSPACE" --from "$FROM" \
            --receipt "$RUNNER_TEMP/smoke/$WORKSPACE.json"
      - uses: actions/upload-artifact@v6
        with:
          name: extensions-npm-smoke-${{ github.sha }}-${{ matrix.workspace }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: error
          retention-days: 30

  bootstrap:
    if: inputs.operation == 'bootstrap'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: extensions-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/extensions-npm-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: node "$RUNNER_TEMP/extensions-npm-release/verify-dependencies.mjs" "$RUNNER_TEMP/extensions-npm-release/manifest.json"
      - name: Publish only exact versions awaiting release ownership
        env:
          # A package cannot trust this repository before its name exists, and packages moving from
          # Hands still trust their former owner. This protected token establishes this release;
          # ordinary releases use the stage operation.
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: node "$RUNNER_TEMP/extensions-npm-release/publish.mjs" bootstrap

  hold:
    if: inputs.operation == 'hold'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: extensions-npm-release-${{ needs.validate.outputs.release_sha }}
          path: ${{ runner.temp }}/extensions-npm-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.stage_run_id }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Keep this exact release staged without latest
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.release_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          RELEASE_MANIFEST: ${{ runner.temp }}/extensions-npm-release/manifest.json
        run: node tools/publish.mjs hold

  promote:
    if: inputs.operation == 'promote'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: extensions-npm-release-${{ needs.validate.outputs.release_sha }}
          path: ${{ runner.temp }}/extensions-npm-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.stage_run_id }}
      - uses: actions/download-artifact@v7
        with:
          pattern: extensions-npm-smoke-${{ needs.validate.outputs.release_sha }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/extensions-npm-smoke
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.stage_run_id }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: node tools/verify-dependencies.mjs "$RUNNER_TEMP/extensions-npm-release/manifest.json"
      - name: Promote the staged archives without republishing
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.release_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          SMOKE_RECEIPTS: ${{ runner.temp }}/extensions-npm-smoke
        run: node "$RUNNER_TEMP/extensions-npm-release/publish.mjs" promote
