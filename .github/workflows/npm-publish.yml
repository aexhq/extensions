name: publish npm packages

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bootstrap ownership, stage under next, hold next, or promote to latest
        type: choice
        required: true
        default: stage
        options: [bootstrap, stage, hold, promote]
      expected_commit:
        description: Exact 40-character extensions commit selected by the workflow ref
        type: string
        required: true
      image_run_id:
        description: Successful immutable image build for this commit (bootstrap or stage)
        type: string
        required: false
        default: ''
      stage_run_id:
        description: Successful stage or bootstrap run containing the immutable archives (hold or promote)
        type: string
        required: false
        default: ''

concurrency:
  group: extensions-npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the immutable source identity
        id: identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          OPERATION: ${{ inputs.operation }}
          SELECTED_COMMIT: ${{ github.sha }}
          SELECTED_REF: ${{ github.ref }}
          STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          IMAGE_RUN_ID: ${{ inputs.image_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SELECTED_COMMIT" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$SELECTED_REF" = "refs/tags/release/sha-$EXPECTED_COMMIT"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          git merge-base --is-ancestor "$EXPECTED_COMMIT" origin/main
          release_sha="$EXPECTED_COMMIT"
          if [[ "$OPERATION" == promote || "$OPERATION" == hold ]]; then
            [[ "$STAGE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            stage_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID")
            test "$(jq -r .event <<<"$stage_run")" = workflow_dispatch
            test "$(jq -r .status <<<"$stage_run")" = completed
            test "$(jq -r .conclusion <<<"$stage_run")" = success
            [[ "$(jq -r .path <<<"$stage_run")" == .github/workflows/npm-publish.yml* ]]
            release_sha=$(jq -r .head_sha <<<"$stage_run")
            [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          else
            test -z "$STAGE_RUN_ID"
            [[ "$IMAGE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            image_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_RUN_ID")
            test "$(jq -r .head_sha <<<"$image_run")" = "$EXPECTED_COMMIT"
            test "$(jq -r .conclusion <<<"$image_run")" = success
            test "$(jq -r .path <<<"$image_run")" = .github/workflows/image.yml

            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED_COMMIT&event=push" --jq '.workflow_runs | any(.status == "completed" and .conclusion == "success")' | grep -x true
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/modal-integration.yml/runs?head_sha=$EXPECTED_COMMIT&event=workflow_dispatch" --jq '.workflow_runs | any(.status == "completed" and .conclusion == "success")' | grep -x true
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  stage-tests:
    if: inputs.operation == 'bootstrap' || inputs.operation == 'stage'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - name: Install Tool test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - run: npx playwright install-deps chromium
      - run: npm run test:prepare
      - run: bash tools/ci-browser-sandbox.sh
      - run: npm test

  stage-package-smoke:
    if: inputs.operation == 'bootstrap' || inputs.operation == 'stage'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - run: npm run build
      - run: npm run package-smoke

  prepare:
    if: inputs.operation == 'bootstrap' || inputs.operation == 'stage'
    needs: [validate, stage-tests, stage-package-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      versions: ${{ steps.pack.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v7
        with:
          name: agentloops-image-${{ github.sha }}
          path: ${{ runner.temp }}/agentloops-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.image_run_id }}
      - name: Pack the exact release archives
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/extensions-npm-release"
          node tools/npm-release.mjs pack "$release_dir"
          image_manifest="$RUNNER_TEMP/agentloops-image/agentloops-image.json"
          test "$(jq -er .source_sha "$image_manifest")" = "$GITHUB_SHA"
          cp "$image_manifest" "$release_dir/agentloops-image.json"
          versions=$(node tools/npm-release.mjs versions "$release_dir/manifest.json")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          node tools/npm-release.mjs markdown "$release_dir/manifest.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: extensions-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/extensions-npm-release
          if-no-files-found: error
          retention-days: 30

  stage:
    if: inputs.operation == 'stage'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: extensions-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/extensions-npm-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: node "$RUNNER_TEMP/extensions-npm-release/verify-dependencies.mjs" "$RUNNER_TEMP/extensions-npm-release/manifest.json"
      - name: Publish once under next
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: node "$RUNNER_TEMP/extensions-npm-release/publish.mjs" stage
      - name: Record staged versions
        env:
          VERSIONS: ${{ needs.prepare.outputs.versions }}
        run: echo "Staged exact versions under npm dist-tag \`next\` — \`$VERSIONS\`" >> "$GITHUB_STEP_SUMMARY"

  bootstrap:
    if: inputs.operation == 'bootstrap'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: extensions-npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/extensions-npm-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: node "$RUNNER_TEMP/extensions-npm-release/verify-dependencies.mjs" "$RUNNER_TEMP/extensions-npm-release/manifest.json"
      - name: Publish only exact versions awaiting release ownership
        env:
          # A package cannot trust this repository before its name exists, and packages moving from
          # Hands still trust their former owner. This protected token establishes this release;
          # ordinary releases use the stage operation.
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: node "$RUNNER_TEMP/extensions-npm-release/publish.mjs" bootstrap

  hold:
    if: inputs.operation == 'hold'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: extensions-npm-release-${{ needs.validate.outputs.release_sha }}
          path: ${{ runner.temp }}/extensions-npm-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.stage_run_id }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Keep this exact release staged without latest
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.release_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          RELEASE_MANIFEST: ${{ runner.temp }}/extensions-npm-release/manifest.json
        run: node tools/publish.mjs hold

  promote:
    if: inputs.operation == 'promote'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: extensions-npm-release-${{ needs.validate.outputs.release_sha }}
          path: ${{ runner.temp }}/extensions-npm-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.stage_run_id }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: node tools/verify-dependencies.mjs "$RUNNER_TEMP/extensions-npm-release/manifest.json"
      - name: Promote the staged archives without republishing
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.release_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: node "$RUNNER_TEMP/extensions-npm-release/publish.mjs" promote

  promote-image:
    if: inputs.operation == 'promote'
    needs: [validate, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extensions-npm-release-${{ needs.validate.outputs.release_sha }}
          path: ${{ runner.temp }}/extensions-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.stage_run_id }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested manifest
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.release_sha }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/extensions-release/agentloops-image.json"
          test "$(jq -er .source_sha "$manifest")" = "$EXPECTED_COMMIT"
          image=$(jq -er .image "$manifest")
          digest=$(jq -er .manifest_digest "$manifest")
          docker buildx imagetools inspect "$image@$digest" >/dev/null
          docker buildx imagetools create -t "$image:latest" "$image@$digest"
          promoted=$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}' | jq -er .digest)
          test "$promoted" = "$digest"
          echo "Promoted the tested image to \`$image:latest\` at \`$image@$digest\`." >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    if: inputs.operation == 'promote'
    needs: [validate, promote, promote-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extensions-npm-release-${{ needs.validate.outputs.release_sha }}
          path: ${{ runner.temp }}/extensions-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.stage_run_id }}
      - name: Publish the tested extension and image mapping
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/extensions-release"
          tag="release/sha-$EXPECTED_COMMIT"
          test "$(jq -er .source "$release_dir/manifest.json")" = "$EXPECTED_COMMIT"
          test "$(jq -er .source_sha "$release_dir/agentloops-image.json")" = "$EXPECTED_COMMIT"
          versions=$(jq -r '[.packages[] | "\(.name)@\(.version)"] | join(", ")' "$release_dir/manifest.json")
          image=$(jq -r '"\(.image)@\(.manifest_digest)"' "$release_dir/agentloops-image.json")
          printf 'Packages: `%s`\n\nImage: `%s`\n\nThe attached manifests identify the exact packages and image tested together.\n' \
            "$versions" "$image" > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Agentloop extensions $versions" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          mkdir "$RUNNER_TEMP/existing-release-assets"
          for filename in manifest.json agentloops-image.json; do
            if grep -Fxq "$filename" <<<"$assets"; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$filename" \
                --dir "$RUNNER_TEMP/existing-release-assets"
              cmp "$release_dir/$filename" "$RUNNER_TEMP/existing-release-assets/$filename"
            else
              gh release upload "$tag" "$release_dir/$filename" --repo "$GITHUB_REPOSITORY"
            fi
          done
          if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
