name: Modal Environment integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modal:
    environment: modal-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @aexhq/env-modal
      - name: Prove real provider isolation and termination
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: npm run test:integration --workspace @aexhq/env-modal
